services:
  migrate:
    build:
      context: .
      target: development
    env_file:
      - .env.development
    environment:
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy
    command: node -r ts-node/register ./node_modules/typeorm/cli.js migration:run -d src/config/data-source.ts
    networks:
      - chat-net

  queue:
    build:
      context: .
      target: development
    env_file:
      - .env.development
    environment:
      - NODE_ENV=development
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy

    command: node dist/worker.js
    networks:
      - chat-net

  app:
    build:
      context: .
      target: development
    ports:
      - '${PORT}:4000'
    env_file:
      - .env.development
    environment:
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - chat-net

  adminer:
    image: adminer
    restart: always
    ports:
      - '8081:8080'
    networks:
      - chat-net
    depends_on:
      - db

  db:
    image: mysql:8.0.33
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - 3307:3306
    environment:
      MYSQL_ROOT_PASSWORD: ows@123
      MYSQL_DATABASE: chat_app
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - chat-net

  redis:
    image: redis:latest
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat-net

volumes:
  db-data:
  redis-data:

networks:
  chat-net:
    driver: bridge
