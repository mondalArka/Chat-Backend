name: Integration ci

on:
  push:

  pull_request:
    branches:
      - master

jobs:
  
  build:
    uses: ./.github/workflows/Helper-workflow-CI.yaml # call the helperwokflow to build
  
  tests:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to current code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Downloading artifacts
        uses: actions/download-artifact@v4
        with: 
          name: build-output
          path: dist/

      - name: Install dependencies
        run: npm ci

      - name: Running tests
        run: npm run test

      - run: echo "Tests Passed"